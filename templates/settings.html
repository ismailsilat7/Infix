<body>

        <i class="ri-home-4-line"></i>
        <a href="/">Home</a>
      </div>
      <div class="menu-item">
        <i class="ri-account-circle-line"></i>
        <a href="/about">About Infix</a>
      </div>
      <div class="menu-item">
        <i class="ri-dashboard-line"></i>
        <a href="/dashboard">Dashboard</a>
      </div>

      <form action="/settings">
        <!-- User info -->
        <input type="hidden" name="action" value="update">
        <div class="input-container">
          <h1>Full Name</h1>
          <input type="text" class="fullname" name = "fullname" value = "Ali Kashif" required>
        </div>
        <div class="input-container">
          <h1>Nickname</h1>
          <input type="text" class="nickname" name = "nickname" value = "ali.kashif" required>
        </div>
        <div class="input-container">
          <h1>Email</h1>
          <input type="text" class="fullname" name = "email" value = "alikashif5917@gmail.com" required>
        </div>
        <div class="btns-container">
          <a href="/changepassword">Change Password?</a>
          <button class="submit" type="submit">Save</button>
        </div>
      </form>
    </div>
  </div>
